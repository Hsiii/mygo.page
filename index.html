<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>MyGO!!!!!</title>
  <link rel="icon" type="image/png" href="favicon.png?v=2">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, "微軟正黑體", sans-serif;
      background: #fafaff;
    }
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    h1 {
      font-size: 3em;
      font-weight: bold;
      color: #3b3b3b;
      margin-bottom: 40px;
      letter-spacing: 0.1em;
      text-align: center;
    }
    img {
      max-width: 80vw;
      max-height: 60vh;
      width: auto;
      height: auto;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.09);
      display: block;
      margin: 0 auto;
    }
    .stats {
      margin-top: 40px;
      font-size: 1.2em;
      font-weight: bold;
      color: #555;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>MyGO!!!!!</h1>
  <img src="mygo.jpg" alt="MyGO圖片">
  <div class="stats">
    <span id="stats_loading">載入中...</span>
    <span id="stats_result" hidden>總共有 <span id="vercount_value_site_uv"></span> 位新人，成為迷子 <span id="vercount_value_site_pv"></span> 次</span>
  </div>
  <script>
    const loading = document.getElementById('stats_loading');
    const result = document.getElementById('stats_result');
    const uv = document.getElementById('vercount_value_site_uv');
    const pv = document.getElementById('vercount_value_site_pv');
    const showResult = () => {
      if (uv.textContent.trim() && pv.textContent.trim()) {
        loading.hidden = true;
        result.hidden = false;
      }
    };

    new MutationObserver(showResult).observe(result, { childList: true, characterData: true, subtree: true });

    if (new URLSearchParams(window.location.search).has('mockVercount')) {
      setTimeout(() => {
        uv.textContent = '123';
        pv.textContent = '456';
      }, 1200);
    } else {
      const script = document.createElement('script');

      script.src = 'https://events.vercount.one/js';
      script.defer = true;
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
